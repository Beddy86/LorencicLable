<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d4141c">
<title>Abholung erfassen</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --rot:#d4141c; --rot-text:#fff; --text:#1d1d1f; --grau:#62626a; --linie:#d6d6dc; --bg:#f3f3f5; --karte:#fff; --feld:#fff; --ok:#1a7f37; --warn:#a66a00; --code:#ececf0; }
  @media (prefers-color-scheme: dark) { :root { --rot:#ef4b52; --rot-text:#1a0507; --text:#ececf0; --grau:#a2a2ac; --linie:#3a3a42; --bg:#16161a; --karte:#202026; --feld:#2a2a31; --ok:#4cc26e; --warn:#e6a93a; --code:#2e2e36; color-scheme: dark; } }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; font:16px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text);
         padding:0 max(16px, env(safe-area-inset-left, 0px)) 28px; }
  header { margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding:18px max(16px, env(safe-area-inset-left, 0px)); background:var(--rot); color:var(--rot-text);
           display:flex; align-items:center; justify-content:space-between; gap:14px; }
  header h1 { margin:0; font-size:22px; } header p { margin:2px 0 0; font-size:14px; opacity:.92; }
  .logo { height:46px; width:auto; flex-shrink:0; background:#fff; padding:5px 9px; border-radius:8px; }
  main { max-width:760px; margin:20px auto 0; display:grid; gap:14px; }
  .karte { background:var(--karte); border:1px solid var(--linie); border-radius:12px; padding:18px; min-width:0; }
  .titel { display:block; font-weight:650; margin-bottom:6px; }
  input[type=text], input[type=email], textarea { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--linie); border-radius:8px; background:var(--feld); color:var(--text); }
  textarea { min-height:70px; resize:vertical; }
  input:focus, textarea:focus, button:focus-visible { outline:2px solid var(--rot); outline-offset:1px; }
  .feld { display:grid; gap:4px; margin-bottom:12px; font-weight:600; } .feld input { font-weight:400; }
  .hinweis { color:var(--grau); font-size:14px; margin:6px 0 0; font-weight:400; }
  button { font:inherit; font-weight:650; padding:12px 16px; border-radius:10px; border:1px solid var(--linie); background:var(--feld); color:var(--text); cursor:pointer; }
  button.haupt { background:var(--rot); border-color:var(--rot); color:var(--rot-text); width:100%; font-size:17px; padding:14px; }
  button.rand { border-color:var(--rot); color:var(--rot); }
  .zeile { display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
  .zeile > input { flex:1 1 130px; width:auto; min-width:0; }
  .pos { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; padding:11px 0; border-top:1px solid var(--linie); align-items:center; }
  .pos:first-child { border-top:0; }
  .pos .nr { font-weight:700; font-size:17px; } .pos .txt { color:var(--grau); font-size:14px; grid-column:1; overflow-wrap:anywhere; }
  .pos.unbekannt .nr { color:var(--warn); }
  .menge { grid-column:2; grid-row:1 / span 2; display:flex; align-items:center; gap:6px; }
  .menge button { width:40px; height:40px; padding:0; font-size:20px; line-height:1; }
  .menge input { width:56px; text-align:center; padding:9px 4px; font-weight:700; font-size:17px; }
  .menge .weg { color:var(--rot); margin-left:4px; }
  .summe { display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:2px solid var(--linie); font-weight:650; }
  .leer { color:var(--grau); padding:6px 0; }
  .meldung { margin-top:12px; padding:11px 13px; border-radius:8px; background:var(--code); font-size:15px; }
  .meldung.ok { border-left:4px solid var(--ok); } .meldung.warn { border-left:4px solid var(--warn); }
  details summary { cursor:pointer; font-weight:650; }
  footer { color:var(--grau); font-size:13px; text-align:center; margin-top:6px; } footer a { color:inherit; }
  /* Barcode-Scanner */
  .scanzeile { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  #scanbtn { font:inherit; font-weight:600; padding:9px 14px; border-radius:8px; border:1px solid var(--rot); background:transparent; color:var(--rot); cursor:pointer; }
  #scan { position:fixed; inset:0; z-index:50; background:#000; display:flex; flex-direction:column; color:#fff; }
  #scan video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #scan .rahmen { position:absolute; left:50%; top:42%; width:min(88vw,560px); height:min(34vw,200px); min-height:110px; transform:translate(-50%,-50%);
                  border-radius:12px; box-shadow:0 0 0 100vmax rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.55); }
  #scan .rahmen i { position:absolute; width:26px; height:26px; border:4px solid #ff3b43; }
  #scan .rahmen i:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0;border-top-left-radius:12px}
  #scan .rahmen i:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0;border-top-right-radius:12px}
  #scan .rahmen i:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0;border-bottom-left-radius:12px}
  #scan .rahmen i:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0;border-bottom-right-radius:12px}
  #scan .rahmen b { position:absolute; left:8px; right:8px; top:50%; height:2px; background:#ff3b43; box-shadow:0 0 8px #ff3b43; animation:scanlinie 1.6s ease-in-out infinite alternate; }
  @keyframes scanlinie { from{top:12%} to{top:88%} }
  #scan .rahmen.treffer { border-color:#3ddc84; } #scan .rahmen.fehler { border-color:#ffb020; }
  #scan .oben { position:relative; padding:14px 16px; background:linear-gradient(#000a,#0000); font-size:15px; }
  #scan .unten { position:absolute; left:0; right:0; bottom:0; padding:14px 16px max(16px,env(safe-area-inset-bottom,0px)); background:linear-gradient(#0000,#000c); display:grid; gap:10px; }
  #scan .meldung { min-height:44px; font-size:16px; line-height:1.35; }
  #scan .knoepfe { display:flex; gap:10px; flex-wrap:wrap; }
  #scan button { font:inherit; font-weight:600; padding:11px 16px; border-radius:10px; border:1px solid #fff6; background:#ffffff1f; color:#fff; }
  #scan button.fertig { background:#d4141c; border-color:#d4141c; margin-left:auto; }
</style></head><body>

            <button type="button" id="scanlicht" hidden>🔦 Licht</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOOKUP = new Map(), EANMAP = new Map();
const eanNorm = c => String(c).trim().replace(/^0+/, '');
let POS = [];                 // {mat, text, menge, unbekannt}
const SPEICHER = 'abholung-v1';

function sichern() { try { localStorage.setItem(SPEICHER, JSON.stringify({ POS, kunde: $('kunde').value, notiz: $('notiz').value, mitarbeiter: $('mitarbeiter').value, empf: $('empf').value })); } catch (e) { /* ohne Speicher */ } }
function laden() {
  try {
    const d = JSON.parse(localStorage.getItem(SPEICHER) || 'null'); if (!d) return;
    POS = d.POS || []; $('kunde').value = d.kunde || ''; $('notiz').value = d.notiz || ''; $('mitarbeiter').value = d.mitarbeiter || ''; $('empf').value = d.empf || '';
  } catch (e) { /* leer */ }
  const an = new URLSearchParams(location.search).get('an'); if (an) $('empf').value = an;
}
async function ladeDaten() {
  try {
    const liste = await fetch('liste.json').then(r => r.json());
    for (const [m, t] of liste) LOOKUP.set(m.toUpperCase(), [m, t]);
    try { const ean = await fetch('ean.json').then(r => r.ok ? r.json() : {}); for (const [k, m] of Object.entries(ean)) EANMAP.set(k, m); } catch (e) { /* optional */ }
    $('listeinfo').textContent = LOOKUP.size.toLocaleString('de-AT') + ' Artikel';
  } catch (e) { $('listeinfo').textContent = 'konnte nicht geladen werden – Seite neu laden'; }
}
function finde(code) {
  code = String(code).trim();
  return LOOKUP.get(code.toUpperCase()) || LOOKUP.get((EANMAP.get(eanNorm(code)) || '').toUpperCase()) || null;
}
function meldung(t, art) { const m = $('meldung'); m.hidden = !t; m.className = 'meldung ' + (art || ''); m.innerHTML = t || ''; }

function zeichne() {
  const L = $('liste');
  if (!POS.length) { L.innerHTML = '<p class="leer">Noch nichts erfasst.</p>'; $('summe').hidden = true; sichern(); return; }
  L.innerHTML = POS.map((p, i) => '<div class="pos' + (p.unbekannt ? ' unbekannt' : '') + '"><div class="nr">' + esc(p.mat) + '</div>' +
    '<div class="txt">' + esc(p.text) + '</div><div class="menge"><button type="button" data-a="minus" data-i="' + i + '" aria-label="weniger">−</button>' +
    '<input type="text" inputmode="numeric" value="' + p.menge + '" data-a="set" data-i="' + i + '" aria-label="Menge">' +
    '<button type="button" data-a="plus" data-i="' + i + '" aria-label="mehr">+</button><button type="button" class="weg" data-a="del" data-i="' + i + '" aria-label="entfernen">✕</button></div></div>').join('');
  const stk = POS.reduce((a, p) => a + p.menge, 0);
  $('sumpos').textContent = POS.length + (POS.length === 1 ? ' Position' : ' Positionen'); $('sumstk').textContent = stk + ' Stück';
  $('summe').hidden = false; sichern();
}
$('liste').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i, a = b.dataset.a;
  if (a === 'plus') POS[i].menge++; else if (a === 'minus') POS[i].menge = Math.max(1, POS[i].menge - 1);
  else if (a === 'del') { if (!confirm(POS[i].mat + ' entfernen?')) return; POS.splice(i, 1); }
  zeichne();
});
$('liste').addEventListener('change', e => {
  const t = e.target; if (t.dataset.a !== 'set') return; const n = parseInt(t.value, 10);
  POS[+t.dataset.i].menge = n > 0 ? Math.min(n, 9999) : 1; zeichne();
});
function hinzu(code) {          // liefert die Position zurück
  const e = finde(code); let mat, text, unbekannt = false;
  if (e) { mat = e[0]; text = e[1]; } else { mat = String(code).trim(); text = 'nicht in der Artikelliste – bitte prüfen'; unbekannt = true; }
  let p = POS.find(x => x.mat === mat);
  if (p) p.menge++; else { p = { mat, text, menge: 1, unbekannt }; POS.push(p); }
  zeichne(); return p;
}
function manuell() {
  const v = $('manuell').value.trim(); if (!v) return;
  const p = hinzu(v); $('manuell').value = '';
  meldung(p.unbekannt ? '<b>' + esc(p.mat) + '</b> ist nicht in der Artikelliste – trotzdem aufgenommen.' : '✔ <b>' + esc(p.mat) + '</b> · Menge ' + p.menge, p.unbekannt ? 'warn' : 'ok');
}
$('manuellok').onclick = manuell; $('manuell').addEventListener('keydown', e => { if (e.key === 'Enter') manuell(); });
for (const id of ['kunde', 'notiz', 'mitarbeiter', 'empf']) $(id).addEventListener('input', sichern);
$('leeren').onclick = () => { if (POS.length && !confirm('Alle ' + POS.length + ' Positionen löschen?')) return; POS = []; $('kunde').value = ''; $('notiz').value = ''; meldung(''); zeichne(); };

/* ------------------------------------------------------------ PDF */
const latin = s => String(s).replace(/²/g, '2').replace(/³/g, '3').replace(/[^ -ÿ€–—„“”‚‘’…]/g, '?').replace(/[–—]/g, '-').replace(/[„“”]/g, '"').replace(/[‚‘’]/g, "'").replace(/…/g, '...').replace(/€/g, 'EUR');
function baueBlatt() {
  const { jsPDF } = window.jspdf; const d = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 15, jetzt = new Date(), p2 = n => String(n).padStart(2, '0');
  const datum = p2(jetzt.getDate()) + '.' + p2(jetzt.getMonth() + 1) + '.' + jetzt.getFullYear() + ' ' + p2(jetzt.getHours()) + ':' + p2(jetzt.getMinutes());
  const kunde = latin($('kunde').value.trim() || '-'), ma = latin($('mitarbeiter').value.trim() || '-'), notiz = latin($('notiz').value.trim());
  let y = M;
  const kopf = () => { d.setFont('helvetica', 'bold'); d.setFontSize(18); d.setTextColor(0); d.text('Abholung / Lagerentnahme', M, y + 6); y += 13; };
  kopf();
  d.setFontSize(11); d.setFont('helvetica', 'normal');
  const info = [['Datum', datum], ['Erfasst von', ma], ['Kunde / Auftrag', kunde]];
  for (const [k, v] of info) { d.setFont('helvetica', 'bold'); d.text(k + ':', M, y); d.setFont('helvetica', 'normal'); const z = d.splitTextToSize(v, W - 2 * M - 38); d.text(z, M + 38, y); y += 5.6 * z.length; }
  y += 3;
  const spalten = () => { d.setFillColor(235, 235, 238); d.rect(M, y - 5, W - 2 * M, 8, 'F'); d.setFont('helvetica', 'bold'); d.setFontSize(10.5);
    d.text('Pos', M + 2, y); d.text('Artikelnummer', M + 14, y); d.text('Menge', M + 68, y, { align: 'right' }); d.text('Bezeichnung', M + 74, y); y += 7; };
  spalten();
  POS.forEach((p, i) => {
    const z = d.splitTextToSize(latin(p.text), 104), h = Math.max(7, 4.6 * z.length + 2.6);
    if (y + h > 280) { d.addPage(); y = M + 6; spalten(); }
    d.setFont('helvetica', 'bold'); d.setFontSize(11); d.setTextColor(p.unbekannt ? 180 : 0, p.unbekannt ? 90 : 0, 0);
    d.text(String(i + 1), M + 2, y); d.text(latin(p.mat), M + 14, y);
    d.setFont('helvetica', 'bold'); d.setFontSize(12.5); d.text(String(p.menge), M + 68, y, { align: 'right' });
    d.setFont('helvetica', 'normal'); d.setFontSize(9.5); d.setTextColor(p.unbekannt ? 180 : 0, p.unbekannt ? 90 : 0, 0); d.text(z, M + 74, y); d.setTextColor(0);
    d.setDrawColor(210); d.setLineWidth(0.2); d.line(M, y + h - 4.4, W - M, y + h - 4.4); y += h;
  });
  if (!POS.length) { d.setFont('helvetica', 'italic'); d.text('(keine Artikel)', M + 2, y); y += 8; }
  const stk = POS.reduce((a, p) => a + p.menge, 0);
  y += 2; if (y > 270) { d.addPage(); y = M + 6; }
  d.setFont('helvetica', 'bold'); d.setFontSize(11.5); d.text(POS.length + ' Positionen, ' + stk + ' Stück', W - M - 2, y, { align: 'right' }); y += 8;
  if (notiz) { if (y > 262) { d.addPage(); y = M + 6; } d.setFontSize(10.5); d.text('Notiz:', M, y); d.setFont('helvetica', 'normal'); const z = d.splitTextToSize(notiz, W - 2 * M - 16); d.text(z, M + 16, y); }
  const n = d.getNumberOfPages();
  for (let i = 1; i <= n; i++) { d.setPage(i); d.setFont('helvetica', 'normal'); d.setFontSize(8.5); d.setTextColor(120); d.text('Lorencic Bauservice – Abholung ' + datum + '   |   Seite ' + i + '/' + n, W / 2, 289, { align: 'center' }); }
  const sicher = (kunde === '-' ? 'Abholung' : kunde).replace(/[^\w\-]+/g, '_').slice(0, 30);
  const name = 'Abholung_' + jetzt.getFullYear() + p2(jetzt.getMonth() + 1) + p2(jetzt.getDate()) + '_' + p2(jetzt.getHours()) + p2(jetzt.getMinutes()) + '_' + sicher + '.pdf';
  return { blob: d.output('blob'), name, datum, stk };
}
function speichern(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
function vorPruefung() { if (!POS.length) { meldung('Noch keine Artikel erfasst.', 'warn'); return false; } return true; }
$('nurpdf').onclick = () => { if (!vorPruefung()) return; const r = baueBlatt(); speichern(r.blob, r.name); $('info').textContent = 'PDF gespeichert: ' + r.name; };
$('va01').onclick = async () => {
  if (!vorPruefung()) return;
  const t = POS.map(p => p.mat + '\t' + p.menge).join('\n');
  try { await navigator.clipboard.writeText(t); $('info').textContent = 'Kopiert: ' + POS.length + ' Zeilen (Material, Menge). In VA01 die erste Material-Zelle markieren und Strg+V.'; }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); $('info').textContent = 'Kopiert: ' + POS.length + ' Zeilen.'; } catch (e2) { $('info').textContent = 'Kopieren nicht möglich.'; } ta.remove(); }
};
$('senden').onclick = async () => {
  if (!vorPruefung()) return;
  const an = $('empf').value.trim();
  if (an) { try { await navigator.clipboard.writeText(an); } catch (e) { /* ohne Zwischenablage */ } }
  const r = baueBlatt(), betreff = 'Abholung ' + r.datum + ($('kunde').value.trim() ? ' – ' + $('kunde').value.trim() : '');
  const text = 'Abholung vom ' + r.datum + '\n' + POS.length + ' Positionen, ' + r.stk + ' Stück\nErfasst von: ' + ($('mitarbeiter').value.trim() || '-') + '\nPDF im Anhang.\n\nFür VA01 (Material, Menge):\n' + POS.map(p => p.mat + '\t' + p.menge).join('\n');
  const file = new File([r.blob], r.name, { type: 'application/pdf' });
  const txtName = r.name.replace(/\.pdf$/i, '') + '_VA01.txt';
  const txtFile = new File([POS.map(p => p.mat + '\t' + p.menge).join('\r\n') + '\r\n'], txtName, { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [file, txtFile] })) {
    try { await navigator.share({ files: [file, txtFile], title: betreff, text: text.split('\n\nFür VA01')[0] + '\nVA01-Textdatei im Anhang (Strg+A, Strg+C, in VA01 einfügen).' }); $('info').textContent = 'Zum Senden an ' + (an || 'den Empfänger') + ' das Mailprogramm wählen.'; return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  speichern(txtFile, txtName);
  speichern(r.blob, r.name);   // Fallback (Computer): PDF speichern und Mail öffnen, PDF von Hand anhängen
  location.href = 'mailto:' + encodeURIComponent(an) + '?subject=' + encodeURIComponent(betreff) + '&body=' + encodeURIComponent(text + '\n\n(Bitte die gespeicherte PDF-Datei anhängen: ' + r.name + ')');
  $('info').textContent = 'PDF wurde gespeichert – bitte in der Mail anhängen.';
};

/* ------------------------------------------------------------ Scanner (wie bei den Etiketten) */
const SCAN = { stream: null, laeuft: false, stack: [], letzter: '', letzteZeit: 0, audio: null, detect: null };
function scanPiep(ok) {
  try { SCAN.audio = SCAN.audio || new (window.AudioContext || window.webkitAudioContext)(); const o = SCAN.audio.createOscillator(), g = SCAN.audio.createGain();
    o.frequency.value = ok ? 1500 : 300; g.gain.value = 0.15; o.connect(g); g.connect(SCAN.audio.destination); o.start(); o.stop(SCAN.audio.currentTime + (ok ? 0.09 : 0.25)); } catch (e) { /* ohne Ton */ }
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [40, 60, 40]); } catch (e) { /* ohne Vibration */ }
}
function scanMeldung(html, art) { $('scanmeldung').innerHTML = html; const r = $('scanrahmen'); r.classList.remove('treffer', 'fehler'); if (art) { r.classList.add(art); setTimeout(() => r.classList.remove('treffer', 'fehler'), 700); } }
function scanTreffer(code) {
  const jetzt = Date.now();
  if (code === SCAN.letzter && jetzt - SCAN.letzteZeit < 2200) { SCAN.letzteZeit = jetzt; return; }
  SCAN.letzter = code; SCAN.letzteZeit = jetzt;
  const p = hinzu(code); SCAN.stack.push(p.mat); scanPiep(!p.unbekannt);
  if (p.unbekannt) scanMeldung('<b>' + esc(p.mat) + '</b><br>nicht in der Artikelliste – trotzdem aufgenommen', 'fehler');
  else scanMeldung('✔ <b>' + esc(p.mat) + '</b> · Menge ' + p.menge + '<br><span style="opacity:.8">' + esc(p.text.slice(0, 70)) + '</span> · ' + SCAN.stack.length + ' Scans', 'treffer');
}
/* --- Kontrastarme / verblasste Etiketten: Bildaufbereitung vor dem Dekodieren --- */
function scanGrauCanvas(c) {
  const w = c.width, h = c.height, d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data, g = new Uint8ClampedArray(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  return { g, w, h };
}
function scanBild(G) {
  const c = document.createElement('canvas'); c.width = G.w; c.height = G.h; const x = c.getContext('2d'), im = x.createImageData(G.w, G.h);
  for (let i = 0, j = 0; i < G.g.length; i++, j += 4) { im.data[j] = im.data[j + 1] = im.data[j + 2] = G.g[i]; im.data[j + 3] = 255; }
  x.putImageData(im, 0, 0); return c;
}
function scanDehnen(G) {            // Kontrast auf 1%–99% der Helligkeiten strecken
  const hist = new Uint32Array(256); for (let i = 0; i < G.g.length; i++) hist[G.g[i]]++;
  const n = G.g.length; let lo = 0, hi = 255, s = 0;
  for (let v = 0; v < 256; v++) { s += hist[v]; if (s > n * 0.01) { lo = v; break; } }
  s = 0; for (let v = 255; v >= 0; v--) { s += hist[v]; if (s > n * 0.01) { hi = v; break; } }
  if (hi - lo < 10) hi = Math.min(255, lo + 10);
  const f = 255 / (hi - lo), o = new Uint8ClampedArray(n); for (let i = 0; i < n; i++) o[i] = (G.g[i] - lo) * f;
  return { g: o, w: G.w, h: G.h };
}
function scanIntegral(G) {
  const w = G.w, h = G.h, I = new Float64Array((w + 1) * (h + 1));
  for (let y = 0; y < h; y++) { let r = 0; for (let x = 0; x < w; x++) { r += G.g[y * w + x]; I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + r; } }
  return I;
}
function scanMittel(G, I, r) {      // lokaler Mittelwert (Box-Filter, Radius r)
  const w = G.w, h = G.h, M = new Float32Array(w * h);
  for (let y = 0; y < h; y++) { const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
    for (let x = 0; x < w; x++) { const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
      M[y * w + x] = (I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0]) / ((x1 - x0) * (y1 - y0)); } }

}
function scanSchaerfen(G) {         // Unsharp-Mask gegen Unschärfe
  const M = scanMittel(G, scanIntegral(G), 2), o = new Uint8ClampedArray(G.g.length);

}
function scanSchwelle(G, bias) {    // lokale Schwarz-Weiß-Schwelle (gegen Schatten/Verlauf)
  const r = Math.max(10, Math.round(G.w / 14)), M = scanMittel(G, scanIntegral(G), r), o = new Uint8ClampedArray(G.g.length);
  for (let i = 0; i < o.length; i++) o[i] = G.g[i] < M[i] - bias ? 0 : 255;
  return { g: o, w: G.w, h: G.h };
}
function scanVertikal(G, r) {      // Rauschen mitteln: senkrecht über benachbarte Zeilen (Strichcode-Striche sind senkrecht)
  const w = G.w, h = G.h, o = new Uint8ClampedArray(w * h), col = new Float64Array(h + 1);
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) col[y + 1] = col[y] + G.g[y * w + x];
    for (let y = 0; y < h; y++) { const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1); o[y * w + x] = (col[y1] - col[y0]) / (y1 - y0); } }

}
function scanEben(G) {             // Helligkeitsverlauf/Schatten herausrechnen, dann Kontrast strecken
  const M = scanMittel(G, scanIntegral(G), Math.max(10, Math.round(G.w / 10))), D = new Float32Array(G.g.length);
  let mn = 1e9, mx = -1e9; for (let i = 0; i < D.length; i++) { D[i] = G.g[i] - M[i]; }
  const hist = new Uint32Array(512); for (let i = 0; i < D.length; i++) hist[Math.max(0, Math.min(511, Math.round(D[i]) + 256))]++;
  let s = 0, lo = -10, hi = 10; for (let v = 0; v < 512; v++) { s += hist[v]; if (s > D.length * 0.02) { lo = v - 256; break; } }
  s = 0; for (let v = 511; v >= 0; v--) { s += hist[v]; if (s > D.length * 0.02) { hi = v - 256; break; } }
  if (hi - lo < 6) { lo -= 3; hi += 3; }
  const o = new Uint8ClampedArray(D.length), f = 255 / (hi - lo); for (let i = 0; i < o.length; i++) o[i] = (D[i] - lo) * f;

}
function scanHoch(c, f) { const o = document.createElement('canvas'); o.width = Math.round(c.width * f); o.height = Math.round(c.height * f);
  const x = o.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, o.width, o.height); return o; }
const SCAN_NVAR = 7;
function scanVariante(c, k) {       // eine Aufbereitung pro Kamerabild (reihum), damit der Scanner flüssig bleibt
  const G0 = scanGrauCanvas(c), r = Math.max(2, Math.round(G0.h / 12));
  if (k >= 5) { const c2 = scanHoch(c, 2), V2 = scanVertikal(scanGrauCanvas(c2), r * 2);
    return scanBild(k === 5 ? scanSchaerfen(scanDehnen(V2)) : scanSchaerfen(scanEben(V2))); }
  const V = scanVertikal(G0, r);
  if (k === 0) return scanBild(scanDehnen(V));
  if (k === 1) return scanBild(scanEben(V));
  if (k === 2) return scanBild(scanSchaerfen(scanEben(V)));
  if (k === 3) return scanBild(scanSchaerfen(scanDehnen(V)));
  return scanBild(scanSchwelle(scanDehnen(V), 0));
}
function scanMitVarianten(basis) {   // Treffer aus aufbereiteten Bildern gelten erst, wenn derselbe Code kurz darauf nochmal gelesen wird (gegen Fehlerkennung)
  let n = 0; const kand = new Map();
  return async c => { let r = await basis(c); if (r) return r;
    r = await basis(scanVariante(c, n++ % SCAN_NVAR)); if (!r) return null;
    const t = Date.now(), e = kand.get(r); kand.set(r, t);
    if (e && t - e < 4000) { kand.delete(r); return r; } return null; };
}

async function scanDetektor() { SCAN.basis = await scanDetektorBasis(); return scanMitVarianten(SCAN.basis); }
async function scanDetektorBasis() {

async function scanOCR(c) {
